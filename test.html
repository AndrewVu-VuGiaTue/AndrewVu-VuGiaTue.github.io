<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
        }
        h1 { font-size: 3rem; margin-bottom: 20px; }
        p { font-size: 1.5rem; }
        .box {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 20px;
            margin: 30px auto;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <h1>🎉 TEST THÀNH CÔNG!</h1>
    <p>Nếu bạn thấy trang này, browser hoạt động bình thường.</p>
    
    <div class="box">
        <h2 style="color: #B31B1B;">✅ Browser OK</h2>
        <p style="color: #666;">
            Vấn đề có thể là:<br>
            1. Cache của index.html<br>
            2. Phải hard refresh (Ctrl+Shift+R)<br>
            3. Mở file index.html trong Incognito mode
        </p>
    </div>
    
    <p><strong>Tiếp theo:</strong> Mở file index.html trong Incognito mode!</p>
</body>
</html>
